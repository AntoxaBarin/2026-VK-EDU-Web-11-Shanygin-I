<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - StackUnderflow</title>
    <link rel="icon" type="image/x-icon" href="static/img/favicon.ico">
    <link rel="stylesheet" href="static/css/bootstrap.min.css">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <header class="bg-danger text-white py-3 sticky-top">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-2 col-6">
                    <a href="index.html" class="text-white text-decoration-none">
                        <h3 class="mb-0">StackUnderflow</h3>
                    </a>
                </div>
                <div class="col-md-6 col-12 order-md-2 order-3 mt-md-0 mt-2">
                    <form class="d-flex">
                        <input class="form-control me-2" type="search" placeholder="Search..." aria-label="Search">
                        <button class="btn btn-outline-light" type="submit">Search</button>
                    </form>
                </div>
                <div class="col-md-4 col-6 order-md-3 order-2">
                    <div class="d-flex justify-content-end align-items-center">
                        <a href="login.html" class="btn btn-sm btn-outline-light me-2">Log In</a>
                        <a href="signup.html" class="btn btn-sm btn-light">Sign Up</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow-1 py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5 col-md-7">
                    <h2 class="mb-4 text-center">Log In to Your Account</h2>
                    
                    <div class="alert alert-danger d-none" role="alert">
                        You entered an incorrect email or password. Please try again.
                    </div>

                    <div class="card">
                        <div class="card-body p-4">
                            <form>
                                <div class="mb-3">
                                    <label for="loginEmail" class="form-label">Email <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" id="loginEmail" placeholder="example@email.com" required>

                                    <div class="invalid-feedback d-none">
                                        Please enter a valid email address.
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="loginPassword" class="form-label">Password <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="loginPassword" placeholder="Enter password" required>

                                    <div class="invalid-feedback d-none">
                                        Password is required.
                                    </div>
                                </div>

                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="rememberMe">
                                    <label class="form-check-label" for="rememberMe">
                                        Remember me
                                    </label>
                                </div>

                                <div class="d-grid mb-3">
                                    <button type="submit" class="btn btn-primary">Log In</button>
                                </div>

                                <div class="text-center">
                                    <a href="#" class="text-decoration-none small">Forgot password?</a>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="text-center mt-3">
                        <p class="mb-0">Don't have an account? <a href="signup.html" class="text-decoration-none">Sign Up</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>


    <footer class="bg-danger text-white py-3 mt-auto">
        <div class="container">
            <div class="row">
                <div class="col-12 text-center">
                    <p class="mb-0">&copy; 2026 StackUnderflow.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
