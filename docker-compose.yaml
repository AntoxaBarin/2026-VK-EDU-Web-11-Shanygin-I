services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-stackunderflow}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  stack_underflow:
    build: .
    image: "stack_underflow:latest"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media:/app/media
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy

volumes:
  media:
  postgres_data:
