{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StackUnderflow - Ask a Question</title>
    <link rel="icon" href="{% static 'questions/static/img/favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'questions/static/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'questions/static/css/style.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">

    <header class="bg-danger text-white py-3 sticky-top">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-2 col-6">
                    <a href="index.html" class="text-white text-decoration-none">
                        <h3 class="mb-0">StackUnderflow</h3>
                    </a>
                </div>
                <div class="col-md-6 col-12 order-md-2 order-3 mt-md-0 mt-2">
                    <form class="d-flex">
                        <input class="form-control me-2" type="search" placeholder="Search..." aria-label="Search">
                        <button class="btn btn-outline-light" type="submit">Search</button>
                    </form>
                </div>
                <div class="col-md-4 col-6 order-md-3 order-2">
                    <div class="d-flex justify-content-end align-items-center">
                        <div class="unauth-user d-none">
                            <a href="login.html" class="btn btn-sm btn-outline-light me-2">Log In</a>
                            <a href="signup.html" class="btn btn-sm btn-light">Sign Up</a>
                        </div>
                        
                        <div class="auth-user">
                            <a href="ask.html" class="btn btn-sm btn-primary me-3">Ask a Question</a>
                            <a href="profile.html" class="d-flex align-items-center text-white text-decoration-none">
                                <img src="{% static 'questions/static/img/avatar.jpg' %}" alt="Avatar" class="rounded-circle me-2" width="40" height="40">
                                <span>Sponge Bob</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow-1 py-4">
        <div class="container">
            <div class="row">
                <div class="col-lg-9 col-md-8 mb-4">
                </div>

                <div class="col-lg-3 col-md-4">
                    <div class="card mb-4">
                        <div class="card-header bg-light">
                            <h5 class="mb-0">Popular Tags</h5>
                        </div>
                        <div class="card-body">
                            <div class="d-flex flex-wrap gap-2">
                                <a href="tag.html" class="badge bg-secondary text-decoration-none">c++</a>
                                <a href="tag.html" class="badge bg-secondary text-decoration-none">javascript</a>
                                <a href="tag.html" class="badge bg-secondary text-decoration-none">django</a>
                                <a href="tag.html" class="badge bg-secondary text-decoration-none">python</a>
                                <a href="tag.html" class="badge bg-secondary text-decoration-none">rust</a>
                                <a href="tag.html" class="badge bg-secondary text-decoration-none">linux kernel</a>
                                <a href="tag.html" class="badge bg-secondary text-decoration-none">profiling</a>
                                <a href="tag.html" class="badge bg-secondary text-decoration-none">frontend</a>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header bg-light">
                            <h5 class="mb-0">Best Members</h5>
                        </div>
                        <div class="card-body">
                            <ul class="list-unstyled">
                                <li class="mb-2">
                                    <a href="#" class="text-decoration-none d-flex align-items-center">
                                        <img src="{% static 'questions/static/img/avatar.jpg' %}" alt="Avatar" class="rounded-circle me-2" width="30" height="30">
                                        <span>Sponge Bob</span>
                                    </a>
                                </li>
                                <li class="mb-2">
                                    <a href="#" class="text-decoration-none d-flex align-items-center">
                                        <img src="{% static 'questions/static/img/avatar.jpg' %}" alt="Avatar" class="rounded-circle me-2" width="30" height="30">
                                        <span>Patrick</span>
                                    </a>
                                </li>
                                <li class="mb-2">
                                    <a href="#" class="text-decoration-none d-flex align-items-center">
                                        <img src="{% static 'questions/static/img/avatar.jpg' %}" alt="Avatar" class="rounded-circle me-2" width="30" height="30">
                                        <span>Squidward</span>
                                    </a>
                                </li>
                                <li class="mb-2">
                                    <a href="#" class="text-decoration-none d-flex align-items-center">
                                        <img src="{% static 'questions/static/img/avatar.jpg' %}" alt="Avatar" class="rounded-circle me-2" width="30" height="30">
                                        <span>Sandy</span>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-danger text-white py-3 mt-auto">
        <div class="container">
            <div class="row">
                <div class="col-12 text-center">
                    <p class="mb-0">&copy; 2026 StackUnderflow.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="{% static 'questions/static/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
